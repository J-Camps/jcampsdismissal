<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="18" fill="#F7F2EA"/>

  <!-- Dark green J shape — capital J: flat top bar + vertical stroke on right + curve bottom-left -->
  <path d="
    M56 10 L76 10 L76 64
    Q76 90 50 90
    Q24 90 18 74
    L28 68
    Q34 82 50 82
    Q66 82 66 64
    L66 10 Z
  " fill="#0E6B52"/>

  <!-- Green lower fill that merges with J bottom -->
  <path d="
    M18 74 L28 68
    Q34 82 50 82
    Q66 82 66 64
    L76 64
    Q76 90 50 90
    Q24 90 18 74 Z
  " fill="#0E6B52"/>

  <!-- Sun background: white circle in the bowl of the J -->
  <circle cx="42" cy="44" r="23" fill="white"/>

  <!-- Golden yellow thick crescent arc wrapping top-left of sun -->
  <path d="
    M42 21
    A23 23 0 0 0 19 44
    A23 23 0 0 0 26 60
    A17 17 0 0 1 25 44
    A17 17 0 0 1 42 27
    Z
  " fill="#F2A900"/>

  <!-- Sun rays — thick wedges radiating upper-left, alternating gold/light gold -->
  <polygon points="40,23 44,23 46,10 38,10" fill="#F2A900"/>
  <polygon points="35,24 40,23 36,10 30,12" fill="#F7C948"/>
  <polygon points="30,27 35,24 26,12 22,16" fill="#F2A900"/>
  <polygon points="26,32 30,27 18,16 16,20" fill="#F7C948"/>
  <polygon points="22,37 26,32 12,22 10,28" fill="#F2A900"/>
  <polygon points="20,43 22,37 8,30 8,36" fill="#F7C948"/>
  <polygon points="19,50 20,43 6,38 6,44" fill="#F2A900"/>

  <!-- Light blue-gray arc segments (lower-left and upper-right of sun) -->
  <path d="M46,23 A23 23 0 0 1 60,32 L56,36 A17 17 0 0 0 46,29 Z" fill="#B4C8D8"/>
  <path d="M22,56 A23 23 0 0 0 36,66 L34,60 A17 17 0 0 1 26,52 Z" fill="#B4C8D8"/>

  <!-- Orange center dot -->
  <circle cx="42" cy="44" r="10" fill="#D98D1B"/>

  <!-- White waves cutting across the J horizontally -->
  <path d="
    M16 66 Q26 58 36 66 Q46 74 56 66 Q64 60 72 66
    L72 62 Q64 56 56 62 Q46 70 36 62 Q26 54 16 62 Z
  " fill="white"/>
</svg>
